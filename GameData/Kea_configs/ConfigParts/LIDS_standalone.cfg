// adds a standalone version of the Low Impact Docking System as added to Hubble on STS-125
+PART[B10_NDS_passive]:NEEDS[TantaresLV]:FOR[zKea_Configs]{
	@name = B10_LIDS_standalone
	@title = C-100 Mk II LIDS Standalone Soft Capture Mechanism
	@description = A standalone version of the C-100 Mk II's LIDS soft capture ring for unpressurised connections.
	
	@mass = 0.01
	
	MODULE
	{
		name = ModuleB9DisableTransform
		
		transform = NDS_passive_captureRing
		transform = NDS_passive_collider
		transform = NDS_passive_interior
		transform = NDS_passive_rim
		transform = NDS_passive_sensorB
		transform = NDS_passive_sensor
		transform = NDS_passive_SIMAC_a
		transform = NDS_passive_SIMAC_b
		transform = NDS_passive_SIMAC_b_interior
	}
	
	
	!MODULE[ModuleB9PartSwitch],* {}
	
	@MODULE[ModuleCargoPart]
	{
		@packedVolume = 100
	}
}