// adds the solid retro motor used on top of Voskhod
+PART[andromeda_engine_s0_1]:NEEDS[Tantares]:FIRST{
	
	@name = andromeda_engine_s0_2
	@rescaleFactor = 1.2
	@title = Voskhod Backup Retro Motor
	@mass = 0.038
	@stagingIcon = SOLID_BOOSTER
	
	%VABORGANIZER:NEEDS[VABOrganizer]
	{
		%organizerSubcategory = solidEngines
	}
	
	!MODULE[ModuleEnginesFX]{}
	MODULE
    {
        name = ModuleEnginesFX
        EngineType = LiquidFuel
        engineID = main_engine
        runningEffectName = running_main
        thrustVectorTransformName = thrustTransform
        throttleLocked = True
        exhaustDamage = True
        allowShutdown = False
        ignitionThreshold = 0.1
        minThrust = 0
        maxThrust = 26.5
        heatProduction = 500
        fxOffset = 0, 0, 0.0

        PROPELLANT
        {
            name = SolidFuel
            ratio = 1.0
            DrawGauge = True
        }

        atmosphereCurve
        {
            key = 0 224
            key = 1 98.5
			key = 5 0.001
        }
    }
	
	RESOURCE
    {
        name = SolidFuel
        amount = 22
        maxAmount = 22
    }
}

@PART[andromeda_engine_s0_2]:FOR[zzzKea_configs]:NEEDS[Tantares,Waterfall,Avalanche]
{
	!EFFECTS {}
	!MODULE[ModuleWaterfallFX],* {}
	
	EFFECTS
	{
		running_main
		{
			AUDIO
            {
                channel = Ship
                clip = TantaresLV/sounds/sound_rocket_normal
                volume = 0.0 0.0
                volume = 0.1 1.0
                volume = 1.0 1.0
                pitch = 0.0 1.0
                pitch = 1.0 1.0
                loop = true
            }
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		disengage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 0.8
				loop = false
			}
		}
	}
	MODULE
    {
		name = ModuleWaterfallFX
		moduleID = VoskBackupFX
		version = FixedRampRates
		ATMOSPHEREDENSITYCONTROLLER
		{
			name = atmosphereDepth
		}
		THROTTLECONTROLLER
		{
			responseRateUp = 2200
			responseRateDown = 2200
			engineID = main_engine
			name = throttle
		}
		RANDOMNESSCONTROLLER
		{
			range = 0,0
			noiseType = perlin
			scale = 0.5
			minimum = -0.5
			speed = 10
			name = Random
			seed = 40
		}
		TEMPLATE
		{
			templateName = VacPlume
			overrideParentTransform = thrustTransform
			position = 0,0,0
			rotation = 0, 0, 0
			scale = 0.088, 0.088, 0.088
		}
		TEMPLATE
		{
			templateName = waterfall-nozzle-glow-white-1
			overrideParentTransform = thrustTransform
			position = 0,0,0
			rotation = 0, 0, 0
			scale = 0.15, 0.15, 0.16
		}
	}
}