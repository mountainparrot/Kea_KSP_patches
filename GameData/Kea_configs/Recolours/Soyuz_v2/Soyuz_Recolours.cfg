// additonal variant tweaks
@PART[tantares_lv_r7_tank_s3|tantares_lv_r7_s3_interstage]:NEEDS[TantaresLV]{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[b9_colour]]{
		@SUBTYPE[c_white-gray]
		{
			@primaryColor = #666257
			-secondaryColor
		}
		SUBTYPE
		{
			name = c_alt
			title = TantaresLV White Grey Alternate
			primaryColor = #666257
			secondaryColor = #b3b3b3
			TEXTURE
			{
				texture = Kea_configs/Recolours/Soyuz_v2/R7_a1_whitegray_alt
				currentTexture = R7_a1
			}
		}
	}
}
@PART[tantares_lv_r7_tank_s2M_short]:NEEDS[TantaresLV]{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[b9_colour]]{
		@SUBTYPE[c_white-gray]
		{
			@primaryColor = #666257
			-secondaryColor
		}
	}
}

