// white switch for the booster decoupler
@PART[tantares_lv_r7_radial_decoupler]:NEEDS[TantaresLV]{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[b9_colour]]{
		SUBTYPE
		{
			name = c_white
			title = #LOC_tantares_lv_variant_tantares_lv_white
			TEXTURE
			{
				texture = Kea_configs/Recolours/Soyuz_v2/RD_108_Shroud_grey
				baseTransform = s1_decouple
			}
			TEXTURE
			{
				texture = TantaresLV/parts/ANY_ENGINE/RD_107_RD_108/RD_108_Shroud_Normal
                                isNormalMap = True
				baseTransform = s1_decouple
			}
			TEXTURE
			{
				texture = TantaresLV/parts/ANY_ENGINE/RD_107_RD_108/RD_107_Shroud
				baseTransform = s1_decoupler
			}
			TEXTURE
			{
				texture = TantaresLV/parts/ANY_ENGINE/RD_107_RD_108/RD_107_Shroud_NRM
                                isNormalMap = True
				baseTransform = s1_decoupler
			}
		}
	}
}

// interstage nonsense
@PART[tantares_lv_r7_s3_engine_mount]:NEEDS[TantaresLV]{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[b9_colour]]{
		@switcherDescription = Shroud Colour
		@SUBTYPE,*
		{
			@TEXTURE
			{
				transform = Shroud1
				transform = Shroud2
				transform = Shroud3
			}
		}
		SUBTYPE
		{
			name = c_white
			title = #LOC_tantares_lv_variant_tantares_lv_white
			primaryColor = #b3b3b3
			TEXTURE
			{
				texture = Kea_configs/Recolours/Soyuz_v2/R7_a1_whitegray_alt
				currentTexture = R7_a1
				transform = Shroud1
				transform = Shroud2
				transform = Shroud3
			}
		}
	}
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = b9_colour_mount
		switcherDescription = Mount Colour
		SUBTYPE
		{
			name = c_grey
			title = #LOC_tantares_lv_variant_tantares_lv_grey
			primaryColor = #666257
			TEXTURE
			{
				texture = TantaresLV/parts/SOYUZ_V2/R7_a1
				currentTexture = R7_a1
				transform = default
			}
		}
		SUBTYPE
		{
			name = c_white
			title = #LOC_tantares_lv_variant_tantares_lv_white
			primaryColor = #b3b3b3
			TEXTURE
			{
				texture = TantaresLV/parts/SOYUZ_V2/R7_a1_white
				currentTexture = R7_a1
				transform = default
			}
		}
	}
}
