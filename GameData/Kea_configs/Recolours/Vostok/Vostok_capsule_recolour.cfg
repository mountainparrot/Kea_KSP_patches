// Adds a green capped (for early flights) and full green (for later flights) colour switches to the Tantares Vostok capsule
@PART[andromeda_crew_s1_1|andromeda_parachute_s0_1]:NEEDS[Tantares]{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = b9_colour
		switcherDescription = Colour
		SUBTYPE
		{
			name = c_default
			title = #LOC_tantares_variant_tantares_white
			primaryColor = White
			TEXTURE
			{
				texture = Tantares/parts/core_vostok/a1
				currentTexture = a1
			}
		}
		SUBTYPE
		{
			name = c_greencap
			title = Vostok 1
			descriptionSummary = Used on early flights.
			primaryColor = White
			secondaryColor = Green
			TEXTURE
			{
				texture = Kea_configs/Recolours/Vostok/vostok_main_greencap
				currentTexture = a1
			}
		}
		SUBTYPE
		{
			name = c_green
			title = #LOC_tantares_variant_tantares_green
			descriptionSummary = Used on later flights.
			primaryColor = Green
			TEXTURE
			{
				texture = Kea_configs/Recolours/Vostok/vostok_main_green
				currentTexture = a1
			}
		}
		// SUBTYPE
		// {
			// name = c_grey
			// title = Silver
			// primaryColor = Grey
			// TEXTURE
			// {
				// texture = Kea_configs/Recolours/Vostok/vostok_main
				// currentTexture = a1
			// }
		// }
	}
}
