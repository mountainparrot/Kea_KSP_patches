// adds a switch to remove the handrails from HabTech parts

// catch-all patch to add the extra subtype
@PART[ht2_*]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[handrails]]]:LAST[HabTech2]{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[handrails]]
	{
		SUBTYPE
		{
			name = None
			title = None
		}
	}
}
// not you
@PART[ht2_handrail|ht2_BEAM|ht2_SAW_half|ht2_SAW_v2]:LAST[HabTech2]{
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[handrails]]
	{
		!SUBTYPE[None] {}
	}
}


