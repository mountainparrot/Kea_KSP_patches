@PART[ht2_SAW_radiator]:AFTER[HabTech2]{
	MODULE
	{
		name = ModuleB9PartSwitch
		moduleID = handrails
		affectDragCubes = false
		switcherDescription = Handrails
		SUBTYPE
		{
			name = Gold
			title = Gold
			primaryColor = Gold
			secondaryColor = Gold
			transform = radiator_handrails.001
			transform = radiator_handrails.002
			transform = radiator_handrails.003
			transform = radiator_handrails.004
		}
		SUBTYPE
		{
			name = Blue
			title = Blue
			primaryColor = Cerulean
			secondaryColor = Cerulean
			transform = radiator_handrails.001
			transform = radiator_handrails.002
			transform = radiator_handrails.003
			transform = radiator_handrails.004
			TEXTURE
			{
				texture = HabTech2/Parts/Trusses/ht2_details_shared_B
				currentTexture = ht2_details_shared
			}
		}
	}
}
