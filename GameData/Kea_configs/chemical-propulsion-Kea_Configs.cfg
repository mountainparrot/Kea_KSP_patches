// custom engines

// RD-270
@PART[kea_engine_rd_270_s0_1]:NEEDS[ChemicalPropulsion,TantaresLV]:BEFORE[zz_ChemicalPropulsion]
{
	@MODULE[ModuleEngines*],*
	{
		%chemTechFuel = Hydrazine
		%chemTechOxidizer = NTO
	}
	
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[engineSwitch]]
	{
		chemTechConvertEngineSwitch = true
		
		@SUBTYPE[RD-270]
		{
			%chemTechFuel = Hydrazine
			%chemTechOxidizer = NTO
		}
		@SUBTYPE[RD-270M]
		{
			%chemTechFuel = Pentaborane
			%chemTechOxidizer = NTO
		}
		@SUBTYPE[RD-116]
		{
			%chemTechFuel = Kerosene
			%chemTechOxidizer = LqdOxygen
		}
	}
}

