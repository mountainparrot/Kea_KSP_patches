// Just engine rescales and adjustments, Tsyklon is correctly sized but its engines aren't

// Engines //

// RD-250
@PART[tantares_lv_engine_rd_250_s0_1]:NEEDS[TantaresLV]{
	@rescaleFactor = 1.2
	@bulkheadProfiles = size1p2
	
	@MODULE[ModuleEnginesFX]{
		@maxThrust = 220.5 // 25% thrust scaling
	}
	
	@MODULE[ModulePartVariants]{
		@VARIANT[variant1]{
			@displayName = Size 0.75
		}
		@VARIANT[variant2]{
			@displayName = Size 1.2
		}
	}
}

// RD-252
@PART[tantares_lv_engine_rd_252_s0_1]:NEEDS[TantaresLV]{
	@rescaleFactor = 1.2
	@bulkheadProfiles = size1p2
	
	@MODULE[ModulePartVariants]{
		@VARIANT[variant1]{
			@displayName = Size 0.75
		}
		@VARIANT[variant2]{
			@displayName = Size 1.2
		}
	}
}

// RD-855
@PART[tantares_lv_engine_rd_855_s0_1]:NEEDS[TantaresLV]{
	
	@MODULE[ModuleEnginesFX]{
		@maxThrust = 20.5 // 25% thrust scaling
	}
}

// RD-856
@PART[tantares_lv_engine_rd_856_s0_1]:NEEDS[TantaresLV]{
	@rescaleFactor = 0.75
	
	@MODULE[ModuleEnginesFX]{
		@maxThrust = 5
	}
}


// Waterfall //

@PART[tantares_lv_engine_rd_250_s0_1|tantares_lv_engine_rd_252_s0_1]:NEEDS[Waterfall,TantaresLV]:AFTER[zzzKea_configs]{
	@MODULE[ModuleWaterfallFX]{
		@TEMPLATE,*
		{
			@position[*] *= 1.2
			@scale[*] *= 1.2
		}
	}
}