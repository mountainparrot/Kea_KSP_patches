// RD-170 is slightly oversized
@PART[tantares_lv_engine_rd_170_s0_1]:NEEDS[TantaresLV]:FIRST{
	@rescaleFactor = 0.925
}

@PART[tantares_lv_engine_rd_170_s0_1]:NEEDS[Waterfall,TantaresLV]:AFTER[zzzKea_configs]{
	@MODULE[ModuleWaterfallFX]{
		@TEMPLATE,*
		{
			@position[*] *= 0.925
			@scale[*] *= 0.925
		}
	}
}

