// parts of the Eisenhower Angara are overscaled (2.5m KSP scale when they should be 2.25m) and need resizing to better fit with stuff like the TantaresLV Blok-D and Blok-I
// unfortunately this does present some issues with the adapters so keep your procparts handy :)

@PART[eisenhower_angara_1p2tank|eisenhower_angara_1p2mount]:NEEDS[Eisenhower-Astronautics]
{
	@bulkheadProfiles = size1p5 // no rescale for these just fixing the diameter tag for VABO
}
@PART[eisenhower_angara_adapter1p5|eisenhower_angara_urm2*|eisenhower_angara_interstage|eisenhower_angara_a7interstage|eisenhower_angara_a7urm1*]:NEEDS[Eisenhower-Astronautics]
{
	@rescaleFactor = 0.9
	@title ^= :2.5m:2.25m:
	@description ^= :2.5m:2.25m:
	@bulkheadProfiles = size1p8
}
@PART[eisenhower_angara_fairinglarge*]:NEEDS[Eisenhower-Astronautics]
{
	@rescaleFactor = 0.9
	@title ^= :2.5m:2.25m:
	@title ^= :2.75m:2.5m:
	@description ^= :2.5m:2.25m:
	@description ^= :2.75m:2.5m:
	@bulkheadProfiles = size1p8, size2
}
@PART[eisenhower_angara_fairinglarge]:NEEDS[Eisenhower-Astronautics]
{
    @MODULE[ModuleSimpleAdjustableFairing]
	{
		scale = 0.9
		@segmentLength *=  0.9
		@WALL_BASE
		{
			@rootOffset[1] *= 0.9
		}
		@WALL
		{
			@rootOffset[1] *= 0.9
		}
		@CONE
		{
			@rootOffset[1] *= 0.9
		}
	}
}

// RD-0124
@PART[eisenhower_rd0124]:NEEDS[Eisenhower-Astronautics]:FOR[zKea_configs]{
	
	%rescaleFactor = 0.83 // downscaled more than URM-II to allow it to fit on Blok-I
	@bulkheadProfiles = size1
	
	@MODULE[ModuleEnginesFX]{
		@maxThrust = 73.58 // 25% thrust scaling
		
		!atmosphereCurve{}
		%atmosphereCurve
		{
			key = 0 359
			key = 1 245
			key = 4 0.001
		}
	}
	
	@MODULE[ModuleWaterfallFX]
	{
		!TEMPLATE,* {}
		TEMPLATE
		{
			templateName = waterfall-kerolox-upper-1
			overrideParentTransform = thrustTransform
			position = 0,0,0.11
			rotation = 0, 0, 0
			scale = 0.88, 0.88, 0.88
		}
	}
}

